<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page not found | Jibin Kunjumon</title>
<meta name="robots" content="noindex"/>
<!-- Cloudflare Pages serves this body at whatever path was requested, so every
     URL here must be root-absolute. A relative "styles.css" would resolve
     against the missing path (/a/b/styles.css) and load nothing. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/styles.css"/>
<style>
  .notfound{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:2.5rem;gap:0
  }
  .notfound-code{
    font-family:'Manrope',sans-serif;font-weight:800;
    font-size:clamp(3.5rem,12vw,6rem);line-height:1;
    color:var(--accent);margin:0
  }
  .notfound-title{
    font-family:'Manrope',sans-serif;font-weight:700;
    font-size:clamp(1.35rem,4vw,1.9rem);
    color:var(--text);margin:1.25rem 0 0
  }
  .notfound-text{
    color:var(--muted);max-width:34rem;margin:.9rem 0 0;font-size:.95rem
  }
  .notfound-ctas{
    display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:2rem
  }
</style>
</head>
<body>

<main class="notfound">
  <p class="notfound-code">404</p>
  <h1 class="notfound-title">This page doesn't exist.</h1>
  <p class="notfound-text">
    The link may be out of date, or the address may have a typo. The work is all
    still here.
  </p>
  <div class="notfound-ctas">
    <a class="btn-primary" href="/#projects">View Projects</a>
    <a class="btn-ghost" href="/">Back to Home</a>
  </div>
</main>

</body>
</html>
